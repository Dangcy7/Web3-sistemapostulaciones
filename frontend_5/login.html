
<!DOCTYPE html>

<html lang="es">
<head><link href="css/site-common.css" rel="stylesheet"/>
<meta charset="utf-8"/>
<title>Iniciar sesión - CodeWork</title>
<link href="css/sty.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&amp;family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&amp;family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&amp;display=swap" rel="stylesheet"/>
</head>
<body class="site-page">
<header class="site-header">
<a class="site-brand" href="inicio.html">
<img alt="CodeWork" src="icons/logo.png"/>
<span>CodeWork</span>
</a>
<nav>
<a href="inicio.html">Inicio</a>
<a href="Formulario/crud_sistema_postulaciones/registros.html">Postulantes</a>

<a class="site-login" href="login.html">Iniciar sesión</a>
</nav>
</header>
<main>
<section class="login-container">
<div class="login-box">
<h2 class="google-sans-code">
                    Iniciar sesión
                </h2>
<p class="source-code-pro">
                    Ingresa tus datos para acceder al sistema.
                </p>
<form id="loginForm">
<div class="campo">
<label class="source-code-pro" for="usuario">
                            Usuario
                        </label>
<input id="usuario" name="usuario" placeholder="Ingresa tu usuario" required="" type="text"/>
</div>
<div class="campo">
<label class="source-code-pro" for="password">
                            Contraseña
                        </label>
<input id="password" name="password" placeholder="Ingresa tu contraseña" required="" type="password"/>
</div>
<button class="boton source-code-pro" type="submit">
                        Iniciar sesión
                    </button>
<p class="mensaje" id="mensaje"></p>
</form>
</div>
</section>
</main>
<footer class="site-footer">
<p>Proyecto Web 3 - CodeWork</p>
<p>Contacto: ***********@gmail.com | Teléfono: 123-456-7890</p>
<p>© 2026 CodeWork. Todos los derechos reservados.</p>
<div class="social-media">
<a aria-label="Facebook" href="https://www.facebook.com" target="_blank"><img alt="Facebook" class="social-icon" src="icons/facebook.png"/></a>
<a aria-label="Twitter" href="https://www.twitter.com" target="_blank"><img alt="Twitter" class="social-icon" src="icons/x.png"/></a>
<a aria-label="Instagram" href="https://www.instagram.com" target="_blank"><img alt="Instagram" class="social-icon" src="icons/instagram.png"/></a>
</div>
</footer>
<script>
        const formulario = document.getElementById("loginForm");
        formulario.addEventListener("submit", function(event) {
            event.preventDefault();
            const usuario = document.getElementById("usuario").value;
            const password = document.getElementById("password").value;
            const mensaje = document.getElementById("mensaje");
            const usuarioCorrecto = "admin";
            const passwordCorrecto = "12345";
            if (
                usuario === usuarioCorrecto &&
                password === passwordCorrecto
            ) {
                mensaje.textContent = "Inicio de sesión correcto.";
                mensaje.className = "mensaje correcto";
                localStorage.setItem("sesionIniciada", "true");
                localStorage.setItem("usuario", usuario);
                setTimeout(function() {
                    window.location.href = "inicio.html";
                }, 1000);
            } else {
                mensaje.textContent =
                    "Usuario o contraseña incorrectos.";

                mensaje.className = "mensaje error";
            }
        });
    </script>
</body>
</html>
